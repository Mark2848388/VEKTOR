name: Build Vektor APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Prepare Android (Gradle 8.9 + Kotlin 2.0 + AGP 8.7)
        run: |
          set -e
          flutter create --project-name vektor --org com.azena /tmp/vs
          rm -rf android
          cp -a /tmp/vs/android ./android

          # --- Gradle Wrapper 8.9 (required by AGP 8.7+) ---
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$WRAPPER" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip|' "$WRAPPER"
            cat "$WRAPPER"
          else
            echo "Missing gradle-wrapper.properties" >&2
            exit 1
          fi

          # --- settings.gradle: AGP + Kotlin ---
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.21"/g' android/settings.gradle || true
            sed -i 's/id "com.android.application" version ".*"/id "com.android.application" version "8.7.0"/g' android/settings.gradle || true
            sed -i 's/id "com.android.library" version ".*"/id "com.android.library" version "8.7.0"/g' android/settings.gradle || true
            # also handle single-quotes
            sed -i "s/id 'org.jetbrains.kotlin.android' version '.*'/id 'org.jetbrains.kotlin.android' version '2.0.21'/g" android/settings.gradle || true
            sed -i "s/id 'com.android.application' version '.*'/id 'com.android.application' version '8.7.0'/g" android/settings.gradle || true
            sed -i "s/id 'com.android.library' version '.*'/id 'com.android.library' version '8.7.0'/g" android/settings.gradle || true
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.0.21"/g' android/settings.gradle.kts || true
            sed -i 's/id("com.android.application") version ".*"/id("com.android.application") version "8.7.0"/g' android/settings.gradle.kts || true
            sed -i 's/id("com.android.library") version ".*"/id("com.android.library") version "8.7.0"/g' android/settings.gradle.kts || true
          fi

          # Root build.gradle kotlin_version
          if [ -f android/build.gradle ]; then
            if grep -q 'kotlin_version' android/build.gradle; then
              sed -i "s/ext.kotlin_version *= *['\"][^'\"]*['\"]/ext.kotlin_version = '2.0.21'/g" android/build.gradle || true
            fi
          fi

          # App module
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/applicationId [= ]*".*"/applicationId = "com.azena.vektor"/g' "$f" || true
            sed -i 's/applicationId ".*"/applicationId "com.azena.vektor"/g' "$f" || true
            sed -i 's/namespace [= ]*".*"/namespace = "com.azena.vektor"/g' "$f" || true
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' "$f" || true
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdk 35/g' "$f" || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' "$f" || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdk 24/g' "$f" || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' "$f" || true
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdk 35/g' "$f" || true
            sed -i 's/jvmTarget = ".*"/jvmTarget = "17"/g' "$f" || true
          done

          # gradle.properties
          {
            echo 'org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError'
            echo 'android.useAndroidX=true'
            echo 'android.enableJetifier=true'
          } >> android/gradle.properties

          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            for perm in INTERNET RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
              if ! grep -q "android.permission.$perm" "$MANIFEST"; then
                sed -i "/<manifest/a\    <uses-permission android:name=\"android.permission.$perm\"/>" "$MANIFEST"
              fi
            done
            if ! grep -q 'queries' "$MANIFEST"; then
              sed -i '/<\/manifest>/i\    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" \/>\n        <\/intent>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" \/>\n        <\/intent>\n        <intent>\n            <action android:name="android.intent.action.MAIN" \/>\n        <\/intent>\n    <\/queries>' "$MANIFEST"
            fi
          fi

          echo "===== wrapper ====="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "===== settings (plugins) ====="
          grep -n 'id ' android/settings.gradle android/settings.gradle.kts 2>/dev/null || true

      - run: flutter pub get

      - name: Launcher icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: vektor-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
